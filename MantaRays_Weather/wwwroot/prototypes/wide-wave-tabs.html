<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MantaRays Weather — Wave Tabs Concept 1</title>
  <style>
    :root{--bg-light:rgba(217,217,217,.85);--bg-dark:rgba(47,93,125,.85);--primary:#13364d;--primary-light:#2f5d7d;--secondary:#ed683c;--tertiary:#fec90e;--white:#fff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Baloo Bhaijaan 2',Helvetica,Arial,sans-serif;color:var(--primary);background:#dcebf0 url('../img/WaterBg.jpg') center/cover fixed}body{padding:0 24px}.page{max-width:1440px;margin:0 auto}.inputHeaderSm{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px}.inputHeaderSm #headerTitle{width:10rem;margin-top:-2px}.controls{display:flex;align-items:center;gap:10px}.controls form{display:flex}.controls input,.controls button{height:2.3rem;border:1px solid var(--bg-dark);border-radius:6px;font:inherit}.controls input{min-width:12.2rem;padding:4px 10px}.searchBtn{background:var(--secondary);color:var(--white);font-size:1.1rem;font-weight:700}.login{padding:3px 14px;background:var(--primary);color:#fff}.currentForecastContainer{display:flex;align-items:center;justify-content:flex-end;gap:30px;padding:0 45px;border-radius:17px;background:var(--bg-light)}.currentForecastImage{flex-shrink:0;padding:10px 2px}.currentForecastImage img{display:block;width:170px;height:165px;object-fit:contain;padding:5px}.currentData{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:15px;padding:25px 0 15px}.currentData h1{margin:0;color:var(--primary);font-size:4.5rem;line-height:.9;text-align:center}.currentData h2{margin:10px 0 0;color:var(--primary-light);font-size:2rem;text-align:center}.currentLowHigh,.windHumid,.windHumid>div{display:flex;align-items:center;gap:15px}.currentLowHigh{font-size:2rem}.currentLowHigh>div,.windHumid>div{display:flex;align-items:center;gap:8px}.currentLowHigh>div:first-child{color:var(--secondary)}.currentLowHigh>div:last-child{color:#2e4c60}.currentLowHigh img{width:30px;height:30px}.windHumid{font-size:1.25rem}.windHumid img{width:26px;height:26px;object-fit:contain}.weather-tabs{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px;border-bottom:1px solid #ffffff80;background:#ffffff24}.weather-tabs button{z-index:1;min-height:58px;border:0;background:transparent;color:var(--primary);font-family:inherit;font-size:1.15rem;font-weight:700;cursor:pointer}.weather-tabs button[aria-selected=true]{color:var(--white)}.weather-tabs button:focus-visible{outline:3px solid var(--tertiary);outline-offset:-4px}.wave{position:absolute;bottom:0;left:0;width:50%;height:10px;pointer-events:none;transition:transform .35s ease}.wave path{fill:none;stroke:var(--tertiary);stroke-width:5;stroke-linecap:round}.forecastWrapper{position:relative;min-height:280px;margin:0 -24px;background:var(--bg-dark);padding:8px 0 20px}.forecastPanel{padding:10px 2rem 24px}.forecastHeading{margin:0 0 10px;color:white;font-size:1.35rem}.forecastRow{display:flex;gap:0;overflow-x:auto;border:4px groove var(--tertiary);background:#fff;scrollbar-color:var(--primary-light) #e8edef}.forecastCard{display:flex;flex:0 0 175px;flex-direction:column;align-items:center;gap:8px;padding:8px 10px;border-right:1px solid #d9e1e4;text-align:center}.forecastCard:last-child{border-right:0}.forecastCard strong{font-size:1.1rem}.forecastCard img.weatherIcon{width:110px;height:82px;object-fit:contain}.forecastCard .temp{display:flex;align-items:center;gap:4px;font-size:1rem}.high{color:#ed683c}.low{color:var(--primary)}.hourly .forecastCard{flex-basis:160px}.hourly .weatherIcon{width:82px!important;height:76px!important}.hourly .condition{min-height:42px;font-size:.88rem;line-height:1.2}.hourly .wind{font-size:.8rem;color:var(--primary-light)}.hidden{display:none!important}
    @media(max-width:768px){body{padding:0 14px}.inputHeaderSm{max-width:90vw;justify-content:center;margin:auto}.currentForecastContainer{justify-content:space-between;gap:8px;width:100%;padding:4px 5px}.currentForecastImage img{width:125px;height:140px}.currentData{align-items:flex-end;gap:12px;padding:5px}.currentData h1{font-size:3rem}.currentData h2{font-size:1.2rem;padding:5px 0}.currentLowHigh{font-size:1.2rem;gap:7px}.currentLowHigh img{width:22px;height:22px}.windHumid{gap:8px;font-size:.95rem}.forecastWrapper{margin-left:-14px;margin-right:-14px}.forecastPanel{padding:8px}.forecastCard{flex-basis:145px}}
    @media(max-width:430px){.inputHeaderSm #headerTitle{width:8.5rem}.controls input{min-width:9rem}.currentForecastImage img{width:90px}.windHumid img{width:20px;height:20px}.windHumid{font-size:.8rem}.currentLowHigh{font-size:1rem}}
  </style>
</head>
<body>
  <main class="page">
    <header class="inputHeaderSm"><img id="headerTitle" src="../img/MantaRaysTitle.svg" alt="MantaRays Weather"><div class="controls"><form onsubmit="return false"><input type="number" placeholder="Enter a ZipCode" aria-label="Enter a ZIP code"><button class="searchBtn" type="submit">⌕ Go</button></form><button class="login" type="button">Log in</button></div></header>
    <section class="currentForecastContainer" aria-label="Current weather in San Diego"><div class="currentForecastImage"><img src="../img/MantaRays_Logo.svg" alt="Mostly sunny weather"></div><div class="currentData"><div><h1>72<sup>°F</sup></h1><h2>Mostly Sunny</h2></div><div class="currentLowHigh"><div><img src="../img/up_arrow_icon.svg" alt=""><span>76<sup>°F</sup></span></div><div><img src="../img/down_arrow_icon.svg" alt=""><span>61<sup>°F</sup></span></div></div><div class="windHumid"><div><img src="../img/wind.svg" alt=""><span>SW 8 <sup>mph</sup></span></div><div><img src="../img/Humidity.svg" alt=""><span>42<sup>%</sup></span></div></div></div></section>
    <div class="weather-tabs" role="tablist" aria-label="Forecast views"><button id="daily-tab" role="tab" aria-selected="true" aria-controls="daily-panel">Daily</button><button id="hourly-tab" role="tab" aria-selected="false" aria-controls="hourly-panel">Hourly</button><svg class="wave"
    <section class="forecastWrapper" id="daily-panel" role="tabpanel" aria-labelledby="daily-tab"><div class="forecastPanel"><h2 class="forecastHeading">Daily forecast</h2><div class="forecastRow"><article class="forecastCard"><strong>Tue</strong><img class="weatherIcon" src="../img/Sunny.svg" alt="Sunny"><div class="temp high"><b>High</b> 76°F</div></article><article class="forecastCard"><strong>Tue Night</strong><img class="weatherIcon" src="../img/Night_Clear.svg" alt="Clear"><div class="temp low"><b>Low</b> 61°F</div></article><article class="forecastCard"><strong>Wed</strong><img class="weatherIcon" src="../img/Partly_Cloudy_Icon.svg" alt="Partly cloudy"><div class="temp high"><b>High</b> 75°F</div></article><article class="forecastCard"><strong>Wed Night</strong><img class="weatherIcon" src="../img/Night_Mostly_Clear.svg" alt="Mostly clear"><div class="temp low"><b>Low</b> 60°F</div></article><article class="forecastCard"><strong>Thu</strong><img class="weatherIcon" src="../img/Mostly_Cloudy.svg" alt="Mostly cloudy"><div class="temp high"><b>High</b> 73°F</div></article><article class="forecastCard"><strong>Thu Night</strong><img class="weatherIcon" src="../img/Night_Mostly_Cloudy.svg" alt="Mostly cloudy"><div class="temp low"><b>Low</b> 59°F</div></article></div></div></section>
    <section class="forecastWrapper hidden" id="hourly-panel" role="tabpanel" aria-labelledby="hourly-tab" hidden><div class="forecastPanel hourly"><h2 class="forecastHeading">Hourly forecast</h2><div class="forecastRow"><article class="forecastCard"><strong>Now</strong><img class="weatherIcon" src="../img/Sunny.svg" alt="Sunny"><span class="condition">Mostly sunny</span><span class="wind">SW 8 mph</span><div class="temp">72°F</div></article><article class="forecastCard"><strong>3pm</strong><img class="weatherIcon" src="../img/Sunny.svg" alt="Sunny"><span class="condition">Sunny</span><span class="wind">SW 9 mph</span><div class="temp">74°F</div></article><article class="forecastCard"><strong>4pm</strong><img class="weatherIcon" src="../img/Partly_Cloudy_Icon.svg" alt="Partly cloudy"><span class="condition">Partly cloudy</span><span class="wind">W 8 mph</span><div class="temp">75°F</div></article><article class="forecastCard"><strong>5pm</strong><img class="weatherIcon" src="../img/Sunny.svg" alt="Sunny"><span class="condition">Sunny</span><span class="wind">W 7 mph</span><div class="temp">73°F</div></article><article class="forecastCard"><strong>6pm</strong><img class="weatherIcon" src="../img/Night_Clear.svg" alt="Clear"><span class="condition">Clear</span><span class="wind">W 6 mph</span><div class="temp">70°F</div></article></div></div></section>
  </main>
  <script type="module">
    (() => {
    const tabs=[...document.querySelectorAll('[role="tab"]')], panels=[document.querySelector('#daily-panel'),document.querySelector('#hourly-panel')], wave=document.querySelector('.wave');
    function selectTab(index){tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',i===index?'true':'false');tab.tabIndex=i===index?0:-1});panels.forEach((panel,i)=>{panel.hidden=i!==index;panel.classList.toggle('hidden',i!==index)});wave.style.transform=`translateX(${index*100}%)`}
    tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>selectTab(index));tab.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();const next=(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;tabs[next].focus();selectTab(next)}})});
    })();
  </script>
</body>
</html>
